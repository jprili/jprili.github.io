projects:
  - project:
      key: iron-obd
      name: Iron OBD
      desc: 
        An on-board diagnostics system that includes
        long-term data persistence for vehicles supporting
        the OBD-II protocol, and a dashboard for 
        viewing historical data. Project in collaboration
        Iron IoT.
      link: null
      youtube: null
      github: https://github.com/ironiot/iron-obd2
  - project:
      key: crustracer
      name: crustracer
      desc: A <i>Rust</i> port 
        of the raytracer shown in 
        <a href="https://raytracing.github.io/books/RayTracingInOneWeekend.html">
        "Ray Tracing in One Weekend", Shirley et al
        </a>. 
      link: null
      youtube: null
      github: https://github.com/jprili/crustracer
  - project:
      key: toomre
      name: The Toomre Model
      desc: Simulation of two colliding galaxies in 
        three dimensions.
      link: null
      youtube: https://youtu.be/Y3ONGXlxWSY
      github: https://github.com/jprili/simulation-archive/tree/main/project-1
  - project:
      key: slit-survey
      name: Double-slit Experiment
      desc: Simulation of a 2D quantum barrier with 
        two narrow slits to demonstrate the wave-like
        properties of quantum particles.
      link: null
      youtube: https://youtu.be/LtcPcRGzlZQ
      github: https://github.com/jprili/simulation-archive/tree/main/project-2
  - project:
      key: gnn-mlip
      name: ML Interatomic Potentials with Keras
      desc: Training and prediction of crystalline structure
        potentials to compare with DFT calculations.
      link: https://github.com/jprili/jprili.github.io/blob/main/res/p310_mlip.pdf?raw=true
      youtube: null
      github: https://github.com/jprili/gnn-mlip
  - project:
      key: semiconductor
      name: Characterisation of Semiconducting Materials
      desc: Analysis of a thin semiconducting sheet (GaAs) using
        the Van der Pauw method and Hall Effect to provide
        an analogue to its Quantum Hall Effect and Quantum Dots.

      link: https://github.com/jprili/jprili.github.io/blob/main/res/hall_effect.pdf?raw=true
      youtube: null
      github: null